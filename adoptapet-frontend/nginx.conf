server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Pet photos and applicant documents (the services accept up to 11 MB per request)
  client_max_body_size 12m;

  # API calls go to the gateway, so the app and the API share one origin (no CORS, no hardcoded host).
  # Docker's DNS resolves the name per request, so nginx still starts if the gateway is not up yet.
  resolver 127.0.0.11 valid=10s;
  set $gateway http://api-gateway:8080;
  location /api/ {
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular routes: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
