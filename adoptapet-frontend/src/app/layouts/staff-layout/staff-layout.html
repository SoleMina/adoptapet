<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [attr.role]="isHandset() ? 'dialog' : null"
    [attr.aria-label]="isHandset() ? 'Menú del panel' : null"
  >
    <a class="ap-logo logo" routerLink="/staff/dashboard">
      <mat-icon class="ap-logo__icon" aria-hidden="true">pets</mat-icon>
      AdoptaPet
    </a>
    <p class="team">Equipo del albergue</p>

    <nav class="menu" aria-label="Panel">
      @for (link of links(); track link.path) {
        <a
          class="menu__item"
          [routerLink]="link.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon aria-hidden="true">{{ link.icon }}</mat-icon>
          {{ link.label }}
        </a>
      }
      <hr class="menu__divider" />
      <button type="button" class="menu__item" (click)="logout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        Cerrar sesión
      </button>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="content" [class.content--docked]="!isHandset()">
    <header class="topbar">
      @if (isHandset()) {
        <button matIconButton type="button" aria-label="Abrir menú" (click)="drawer.toggle()">
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
      }
      <nav class="crumbs" aria-label="Ruta de navegación">
        <a routerLink="/staff/dashboard">AdoptaPet</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page">{{ pageTitle() }}</span>
      </nav>

      <span class="spacer"></span>
      <app-theme-toggle />
      <span class="divider" aria-hidden="true"></span>
      <app-user-menu show="role" />

      <mat-progress-bar
        class="progress"
        mode="indeterminate"
        [class.visible]="loading.active()"
        aria-label="Cargando"
      />
    </header>

    <main class="main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
