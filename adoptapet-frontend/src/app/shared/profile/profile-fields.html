<div class="ap-form-grid" [class.email-first]="emailFirst()" [formGroup]="form()">
  <div class="ap-field">
    <label class="ap-field__label" for="firstName">Nombres</label>
    <input
      id="firstName"
      class="ap-input"
      formControlName="firstName"
      autocomplete="given-name"
      maxlength="100"
      [attr.aria-invalid]="form().controls.firstName.invalid && form().controls.firstName.touched"
      aria-describedby="firstName-error"
    />
    <app-field-error [control]="form().controls.firstName" errorId="firstName-error" />
  </div>

  <div class="ap-field">
    <label class="ap-field__label" for="lastName">Apellidos</label>
    <input
      id="lastName"
      class="ap-input"
      formControlName="lastName"
      autocomplete="family-name"
      maxlength="100"
      [attr.aria-invalid]="form().controls.lastName.invalid && form().controls.lastName.touched"
      aria-describedby="lastName-error"
    />
    <app-field-error [control]="form().controls.lastName" errorId="lastName-error" />
  </div>

  @if (showEmail()) {
    <div class="ap-field field--email">
      <label class="ap-field__label" for="email">Correo</label>
      <input
        id="email"
        class="ap-input"
        type="email"
        formControlName="email"
        autocomplete="email"
        maxlength="150"
        [attr.aria-invalid]="form().controls.email.invalid && form().controls.email.touched"
        aria-describedby="email-error"
      />
      <app-field-error [control]="form().controls.email" errorId="email-error" />
    </div>
  }

  <div class="ap-field">
    <label class="ap-field__label" for="dni">DNI</label>
    <input
      id="dni"
      class="ap-input"
      formControlName="dni"
      inputmode="numeric"
      maxlength="8"
      autocomplete="off"
      [attr.aria-invalid]="form().controls.dni.invalid && form().controls.dni.touched"
      aria-describedby="dni-error"
    />
    <app-field-error [control]="form().controls.dni" errorId="dni-error" />
  </div>

  <div class="ap-field">
    <label class="ap-field__label" for="birthDate">Nacimiento</label>
    <input
      id="birthDate"
      class="ap-input"
      type="date"
      formControlName="birthDate"
      autocomplete="bday"
      min="1900-01-01"
      [max]="maxBirthDate"
      [attr.aria-invalid]="form().controls.birthDate.invalid && form().controls.birthDate.touched"
      aria-describedby="birthDate-error"
    />
    <app-field-error [control]="form().controls.birthDate" errorId="birthDate-error" />
  </div>

  <div class="ap-field">
    <label class="ap-field__label" for="phone">Teléfono</label>
    <input
      id="phone"
      class="ap-input"
      type="tel"
      formControlName="phone"
      inputmode="numeric"
      maxlength="9"
      autocomplete="tel-national"
      [attr.aria-invalid]="form().controls.phone.invalid && form().controls.phone.touched"
      aria-describedby="phone-error"
    />
    <app-field-error [control]="form().controls.phone" errorId="phone-error" />
  </div>

  <div class="ap-field field--wide">
    <label class="ap-field__label" for="address">
      Dirección <span class="optional">(opcional)</span>
    </label>
    <input
      id="address"
      class="ap-input"
      formControlName="address"
      autocomplete="street-address"
      maxlength="250"
      [attr.aria-invalid]="form().controls.address.invalid && form().controls.address.touched"
      aria-describedby="address-error"
    />
    <app-field-error [control]="form().controls.address" errorId="address-error" />
  </div>
</div>
