<div class="ap-container page">
  <app-page-header [heading]="heading()" subtitle="Registro de adoptante" />

  <section class="ap-card">
    <ol class="steps" aria-label="Pasos del registro">
      <li [attr.aria-current]="step() === 1 ? 'step' : null">1. Cuenta</li>
      <li aria-hidden="true" class="arrow"><mat-icon>arrow_forward</mat-icon></li>
      <li [attr.aria-current]="step() === 2 ? 'step' : null">2. Datos personales</li>
    </ol>

    <form [formGroup]="form" (ngSubmit)="step() === 1 ? next() : submit()" novalidate>
      @if (step() === 1) {
        <div class="ap-form-grid" formGroupName="account">
          <div class="ap-field">
            <label class="ap-field__label" for="username">Usuario</label>
            <input
              id="username"
              class="ap-input"
              formControlName="username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              maxlength="50"
              [attr.aria-invalid]="account.username.invalid && account.username.touched"
              aria-describedby="username-error"
            />
            <app-field-error [control]="account.username" errorId="username-error" />
          </div>

          <div class="ap-field">
            <label class="ap-field__label" for="email">Correo</label>
            <input
              id="email"
              class="ap-input"
              type="email"
              formControlName="email"
              autocomplete="email"
              maxlength="150"
              [attr.aria-invalid]="account.email.invalid && account.email.touched"
              aria-describedby="email-error"
            />
            <app-field-error [control]="account.email" errorId="email-error" />
          </div>

          <div class="ap-field">
            <label class="ap-field__label" for="password">Contraseña</label>
            <div class="ap-input-group">
              <input
                id="password"
                class="ap-input"
                formControlName="password"
                autocomplete="new-password"
                maxlength="72"
                [type]="showPassword() ? 'text' : 'password'"
                [attr.aria-invalid]="account.password.invalid && account.password.touched"
                aria-describedby="password-hint password-error"
              />
              <button
                matIconButton
                type="button"
                class="ap-input-group__action"
                [attr.aria-label]="showPassword() ? 'Ocultar contraseñas' : 'Mostrar contraseñas'"
                [attr.aria-pressed]="showPassword()"
                (click)="showPassword.set(!showPassword())"
              >
                <mat-icon aria-hidden="true">{{
                  showPassword() ? 'visibility_off' : 'visibility'
                }}</mat-icon>
              </button>
            </div>
            @if (!(account.password.invalid && account.password.touched)) {
              <p class="ap-field__hint" id="password-hint">Mínimo 8 caracteres.</p>
            }
            <app-field-error [control]="account.password" errorId="password-error" />
          </div>

          <div class="ap-field">
            <label class="ap-field__label" for="confirmPassword">Confirmar contraseña</label>
            <input
              id="confirmPassword"
              class="ap-input"
              formControlName="confirmPassword"
              autocomplete="new-password"
              [type]="showPassword() ? 'text' : 'password'"
              [attr.aria-invalid]="
                account.confirmPassword.invalid && account.confirmPassword.touched
              "
              aria-describedby="confirm-error"
            />
            <app-field-error [control]="account.confirmPassword" errorId="confirm-error" />
          </div>
        </div>

        <div class="ap-form-actions">
          <button matButton="filled" type="submit">Continuar</button>
          <a
            matButton="tonal"
            routerLink="/login"
            [queryParams]="returnUrl() ? { returnUrl: returnUrl() } : {}"
          >
            Volver
          </a>
        </div>
      } @else {
        <div class="ap-form-grid" formGroupName="personal">
          <div class="ap-field">
            <label class="ap-field__label" for="firstName">Nombres</label>
            <input
              id="firstName"
              class="ap-input"
              formControlName="firstName"
              autocomplete="given-name"
              maxlength="100"
              [attr.aria-invalid]="personal.firstName.invalid && personal.firstName.touched"
              aria-describedby="firstName-error"
            />
            <app-field-error [control]="personal.firstName" errorId="firstName-error" />
          </div>

          <div class="ap-field">
            <label class="ap-field__label" for="lastName">Apellidos</label>
            <input
              id="lastName"
              class="ap-input"
              formControlName="lastName"
              autocomplete="family-name"
              maxlength="100"
              [attr.aria-invalid]="personal.lastName.invalid && personal.lastName.touched"
              aria-describedby="lastName-error"
            />
            <app-field-error [control]="personal.lastName" errorId="lastName-error" />
          </div>

          <div class="ap-field">
            <label class="ap-field__label" for="dni">DNI</label>
            <input
              id="dni"
              class="ap-input"
              formControlName="dni"
              inputmode="numeric"
              maxlength="8"
              autocomplete="off"
              [attr.aria-invalid]="personal.dni.invalid && personal.dni.touched"
              aria-describedby="dni-error"
            />
            <app-field-error [control]="personal.dni" errorId="dni-error" />
          </div>

          <div class="ap-field">
            <label class="ap-field__label" for="birthDate">Nacimiento</label>
            <input
              id="birthDate"
              class="ap-input"
              type="date"
              formControlName="birthDate"
              autocomplete="bday"
              min="1900-01-01"
              [max]="maxBirthDate"
              [attr.aria-invalid]="personal.birthDate.invalid && personal.birthDate.touched"
              aria-describedby="birthDate-error"
            />
            <app-field-error [control]="personal.birthDate" errorId="birthDate-error" />
          </div>

          <div class="ap-field">
            <label class="ap-field__label" for="phone">Teléfono</label>
            <input
              id="phone"
              class="ap-input"
              type="tel"
              formControlName="phone"
              inputmode="numeric"
              maxlength="9"
              autocomplete="tel-national"
              [attr.aria-invalid]="personal.phone.invalid && personal.phone.touched"
              aria-describedby="phone-error"
            />
            <app-field-error [control]="personal.phone" errorId="phone-error" />
          </div>

          <div class="ap-field">
            <label class="ap-field__label" for="address"
              >Dirección <span class="optional">(opcional)</span></label
            >
            <input
              id="address"
              class="ap-input"
              formControlName="address"
              autocomplete="street-address"
              maxlength="250"
              [attr.aria-invalid]="personal.address.invalid && personal.address.touched"
              aria-describedby="address-error"
            />
            <app-field-error [control]="personal.address" errorId="address-error" />
          </div>
        </div>

        @if (error(); as message) {
          <p class="ap-banner ap-banner--danger error" role="alert">
            <mat-icon aria-hidden="true">error</mat-icon>
            {{ message }}
          </p>
        }

        <div class="ap-form-actions">
          <button matButton="filled" type="submit" [disabled]="submitting()">
            {{ submitting() ? 'Creando tu cuenta…' : 'Crear mi cuenta' }}
          </button>
          <button matButton="tonal" type="button" [disabled]="submitting()" (click)="back()">
            Volver
          </button>
        </div>
      }
    </form>
  </section>
</div>
