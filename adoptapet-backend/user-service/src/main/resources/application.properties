spring.application.name=user-service

# Secrets come from adoptapet-backend/.env (see .env.example). The three paths cover running from the
# service folder (mvn spring-boot:run), from adoptapet-backend/ (java -jar) or from the repo root (IDE).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:adoptapet-backend/.env[.properties]

server.port=${PORT:8081}

# Database: tables are generated from the @Entity classes
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pets_users?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT (same secret in every service)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# First admin, created on startup only if no ADMIN exists
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL:admin@adoptapet.com}

# Eureka (set EUREKA_ENABLED=false to run this service alone)
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}

management.endpoints.web.exposure.include=health,info
