spring.application.name=adoption-service

server.port=${PORT:8083}

# Database: tables are generated from the @Entity classes
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pets_adoptions?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (same secret in every service)
jwt.secret=${JWT_SECRET:420240bc6fe86bde1114c348622848165ef28d2fa389b26660c6220040ba190a}

# Documents: DNI, proof of address, adoption act and signed act (private, never served statically)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
app.storage.documents=${DOCUMENTS_DIR:./uploads/documents}

# Delivery appointments are in Peru time
app.time-zone=America/Lima

# RabbitMQ (guest/guest only works from localhost)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Eureka: needed to reach user-service and pet-service by name
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}

management.endpoints.web.exposure.include=health,info
