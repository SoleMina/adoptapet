spring.application.name=adoption-service

# Secrets come from adoptapet-backend/.env (see .env.example). The three paths cover running from the
# service folder (mvn spring-boot:run), from adoptapet-backend/ (java -jar) or from the repo root (IDE).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:adoptapet-backend/.env[.properties]

server.port=${PORT:8083}

# Database: tables are generated from the @Entity classes
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pets_adoptions?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (same secret in every service)
jwt.secret=${JWT_SECRET}

# Documents: DNI, proof of address, adoption act and signed act (private, never served statically)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
app.storage.documents=${DOCUMENTS_DIR:./uploads/documents}

# Delivery appointments are in Peru time
app.time-zone=America/Lima

# RabbitMQ (guest/guest only works from localhost)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Eureka: needed to reach user-service and pet-service by name
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}

management.endpoints.web.exposure.include=health,info
