spring.application.name=api-gateway
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:adoptapet-backend/.env[.properties]

server.port=${PORT:8080}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}

management.endpoints.web.exposure.include=health,info

# CORS: origins allowed to call the API from the browser (Angular dev server by default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
