spring.application.name=notification-service

server.port=${PORT:8084}

# Database: tables are generated from the @Entity classes
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pets_notifications?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (same secret in every service)
jwt.secret=${JWT_SECRET:420240bc6fe86bde1114c348622848165ef28d2fa389b26660c6220040ba190a}

# RabbitMQ (guest/guest only works from localhost)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Eureka (set EUREKA_ENABLED=false to run this service alone)
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}

management.endpoints.web.exposure.include=health,info
