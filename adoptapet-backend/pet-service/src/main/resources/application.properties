spring.application.name=pet-service

# Secrets come from adoptapet-backend/.env (see .env.example). The three paths cover running from the
# service folder (mvn spring-boot:run), from adoptapet-backend/ (java -jar) or from the repo root (IDE).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:adoptapet-backend/.env[.properties]

server.port=${PORT:8082}

# Database: tables are generated from the @Entity classes
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pets_catalog?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT (same secret in every service)
jwt.secret=${JWT_SECRET}

# Pet images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.pet-images=${PET_IMAGES_DIR:./uploads/pets}

# RabbitMQ (guest/guest only works from localhost)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Eureka (set EUREKA_ENABLED=false to run this service alone)
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}

management.endpoints.web.exposure.include=health,info
